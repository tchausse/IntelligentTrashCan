# ros2_control configuration of the trash can drive.
# wheel_separation and wheel_radius must match urdf/properties.xacro;
# test/test_model.py checks that they do.
controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    wheel_separation: 0.45
    wheel_radius: 0.085

    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true
    publish_rate: 50.0
    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]

    # Stop if commands stop arriving, e.g. when teleop is closed.
    cmd_vel_timeout: 0.5

    # Indoor speeds, gentle enough not to tip an upright bin.
    linear.x.max_velocity: 0.5
    linear.x.min_velocity: -0.3
    linear.x.max_acceleration: 0.8
    linear.x.max_deceleration: -1.2
    angular.z.max_velocity: 1.5
    angular.z.min_velocity: -1.5
    angular.z.max_acceleration: 3.0
    angular.z.max_deceleration: -3.0
